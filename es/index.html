    <p>Ingeniería de software: sistemas, integración, automatización con IA y datos. Convertimos cuellos de botella en eficiencia con soluciones a medida y de alta velocidad.</p>
    <section>
      <h2>Qué hace Agência Byte y para quién</h2>
      <p>Agência Byte es una agencia brasileña de tecnología que desarrolla software a medida, automatizaciones con IA, integraciones entre sistemas y dashboards de datos. Atendemos a empresas de industria, logística y distribución que operan con ERP, hojas de cálculo y canales de venta desconectados y necesitan automatizar tareas repetitivas, sincronizar sistemas y tener números confiables. También trabajamos con startups y pymes. Todo el código lo escribe y mantiene nuestro equipo, sin tercerización, y un primer módulo suele entrar en producción en 3 a 6 semanas.</p>
    </section>
    <section>
      <h2><a href="/es/servicios">Servicios</a></h2>
      <article>
        <h3><a href="/es/servicios/desarrollo-de-software">Desarrollo de Software a Medida</a></h3>
        <p>Web apps, dashboards internos, APIs y portales. Frontend y backend con Next.js, TypeScript y PostgreSQL.</p>
      </article>
      <article>
        <h3><a href="/es/servicios/automatizacion-con-ia">Automatización con Inteligencia Artificial</a></h3>
        <p>Agentes de IA, clasificación, extracción de documentos y atención automatizada 24/7 con LLMs y RAG.</p>
      </article>
      <article>
        <h3><a href="/es/servicios/integracion-de-sistemas">Integración de Sistemas</a></h3>
        <p>Conectar CRM, ERP, e-commerce y otros sistemas con webhooks bidireccionales y sincronización incremental.</p>
      </article>
      <article>
        <h3><a href="/es/servicios/datos-y-power-bi">Datos y Business Intelligence</a></h3>
        <p>Pipelines ETL/ELT, dashboards en Power BI y métricas confiables con alertas inteligentes.</p>
      </article>
    </section>
    <section>
      <h2>Ejemplos de proyectos</h2>
      <p>Escenarios recurrentes en los proyectos de Agência Byte y lo que cambia en cada uno.</p>
      <article>
        <h3><a href="/es/clientes/divina-argila">Divina Argila: 4 sistemas integrados en 40 días</a></h3>
        <p>Divina Argila tenía procesos fragmentados y pedidos que arreglar en 4 lugares distintos. En 40 días, Agência Byte integró Bling, Trello, TikTok Shop y Mercado Livre, y hoy el equipo de fábrica trabaja solo en Trello.</p>
        <blockquote><p>“Ahora nuestro equipo ya no tiene que copiar y pegar el mismo pedido en varios lugares. La fábrica ya sabe qué producir en cuanto se emite el pedido.”</p></blockquote>
        <p>— Divina Argila, cliente de Agência Byte</p>
      </article>
      <article>
        <h3><a href="/es/clientes/cargon">CargOn: data warehouse y 4 dashboards predictivos en 30 días</a></h3>
        <p>CargOn quería crear un producto más para sus clientes a partir de los datos generados en la plataforma. En 30 días, Agência Byte entregó el data warehouse, el ETL y 4 dashboards logísticos en Power BI, con previsiones.</p>
        <blockquote><p>“Ahora nuestros clientes tienen datos estructurados de su propia operación, insights y datos predictivos para usar en su logística, y nosotros creamos un producto más monetizado.”</p></blockquote>
        <p>— CargOn, cliente de Agência Byte</p>
      </article>
      <article>
        <h3>ERP y e-commerce sincronizados</h3>
        <p><strong>Situación:</strong> Los pedidos de la tienda online se vuelven a digitar en el ERP y el stock del sitio no coincide con el stock real.</p>
        <p><strong>Qué entregamos:</strong> Pedidos, productos, precios y stock sincronizados automáticamente entre la tienda y el ERP, con reprocesamiento en caso de fallo y alerta cuando el error persiste.</p>
        <p><strong>Resultado:</strong> Cada pedido se digita 1 vez y recorre todos los sistemas solo. Primer módulo en producción en 3 a 6 semanas.</p>
      </article>
      <article>
        <h3>Atención con IA las 24 horas</h3>
        <p><strong>Situación:</strong> Los contactos llegan por WhatsApp, formulario y correo, alguien copia todo al CRM y, fuera del horario comercial, nadie responde.</p>
        <p><strong>Qué entregamos:</strong> Un agente de IA atiende por WhatsApp, califica el contacto, registra todo en el CRM y pasa a una persona cuando es necesario.</p>
        <p><strong>Resultado:</strong> Atención las 24 horas, los 7 días de la semana, y el equipo recibe el lead ya clasificado.</p>
      </article>
      <article>
        <h3>Dashboards en Power BI con indicadores únicos</h3>
        <p><strong>Situación:</strong> Los informes se arman a mano a fin de mes, a partir de exportaciones, y cada área presenta un número distinto.</p>
        <p><strong>Qué entregamos:</strong> Pipelines ETL/ELT que reúnen los datos del ERP, del CRM y de las hojas de cálculo, y dashboards en Power BI con una definición única para cada indicador.</p>
        <p><strong>Resultado:</strong> El mismo número en todas las áreas, actualizado automáticamente, sin exportar hojas de cálculo.</p>
      </article>
    </section>

    <section>
      <h2>Preguntas frecuentes</h2>
      <h3>¿Agência Byte hace marketing o tráfico pago?</h3>
      <p>No. Somos una empresa de ingeniería de software. No hacemos marketing, tráfico pago, gestión de redes sociales ni creación de contenido: desarrollamos sistemas, integraciones, automatizaciones con IA y dashboards de datos.</p>
      <h3>¿Qué hace Agência Byte?</h3>
      <p>Desarrolla software a medida, automatizaciones con inteligencia artificial, integraciones entre sistemas (ERP, CRM, e-commerce y APIs) y dashboards en Power BI con pipelines de datos. Atiende principalmente a empresas de industria, logística y distribución.</p>
      <h3>¿Cuánto cuesta integrar un ERP y un e-commerce?</h3>
      <p>El valor depende de qué sistemas participan, de cuántos flujos se sincronizan (pedidos, productos, precios, stock) y de lo que permiten las APIs de cada sistema. Después del descubrimiento (2 a 3 días), la etapa de estrategia (2 a 4 días) entrega una propuesta técnica con alcance, cronograma e inversión definidos por escrito, sin sorpresas en el presupuesto.</p>
      <h3>¿Cuánto tarda un proyecto?</h3>
      <p>Un primer módulo en producción suele tardar de 3 a 6 semanas. Los proyectos más grandes se dividen en entregas más pequeñas, para que uses el sistema antes de que termine el proyecto.</p>
      <h3>¿Pueden integrar cualquier sistema?</h3>
      <p>Cualquier sistema que ofrezca API, webhook, base de datos o exportación de archivos. En el descubrimiento evaluamos qué permite cada sistema. No hace falta cambiar de sistema: conectamos lo que ya usas.</p>
      <h3>¿El código queda en mi empresa?</h3>
      <p>Sí. El código lo escribe y mantiene nuestro equipo, sin tercerización, y queda en el repositorio de tu empresa.</p>
      <h3>¿Dan soporte después de la entrega?</h3>
      <p>Sí. Ofrecemos soporte con un SLA de hasta 4 horas hábiles y seguimos evolucionando el sistema contigo después del go-live.</p>
