    <section>
      <h2>O que a Agência Byte faz e para quem</h2>
      <p>A Agência Byte é uma agência brasileira de tecnologia que desenvolve software sob medida, automações com IA, integrações entre sistemas e dashboards de dados. Atendemos empresas de indústria, logística e distribuição que operam com ERP, planilhas e canais de venda desconectados e precisam automatizar tarefas repetitivas, sincronizar sistemas e ter números confiáveis. Também trabalhamos com startups e PMEs. Todo o código é escrito e mantido pelo nosso time, sem terceirização, e um primeiro módulo costuma entrar em produção em 3 a 6 semanas.</p>
    </section>

        <h3><a href="/servicos/desenvolvimento-de-software">Desenvolvimento de Software Sob Medida</a></h3>

      </article>

        <h3><a href="/servicos/automacao-com-ia">Automação com Inteligência Artificial</a></h3>

      <h2>Exemplos de projetos</h2>
      <p>Cenários recorrentes nos projetos da Agência Byte, com o que muda em cada um.</p>
      <article>
        <h3><a href="/clientes/divina-argila">Divina Argila: 4 sistemas integrados em 40 dias</a></h3>
        <p>A Divina Argila tinha processos fragmentados e pedidos para acertar em 4 lugares diferentes. Em 40 dias, a Agência Byte integrou Bling, Trello, TikTok Shop e Mercado Livre, e hoje o time da fábrica trabalha só no Trello.</p>
        <blockquote><p>“Agora, o nosso time não precisa mais ficar copiando e colando o mesmo pedido em vários lugares. A fábrica já sabe o que produzir junto com a emissão do pedido.”</p></blockquote>
        <p>— Divina Argila, cliente da Agência Byte</p>
      </article>
      <article>
        <h3><a href="/clientes/cargon">CargOn: data warehouse e 4 dashboards preditivos em 30 dias</a></h3>
        <p>A CargOn queria criar mais um produto para os seus clientes a partir das informações geradas na plataforma. Em 30 dias, a Agência Byte entregou o data warehouse, o ETL e 4 dashboards logísticos em Power BI, com previsões.</p>
        <blockquote><p>“Agora, nossos clientes têm dados estruturados da operação deles, insights e dados preditivos para poder usar na sua logística, e nós criamos mais um produto monetizado.”</p></blockquote>
        <p>— CargOn, cliente da Agência Byte</p>
      </article>
      <article>
        <h3>ERP e e-commerce sincronizados</h3>
        <p><strong>Situação:</strong> Os pedidos da loja virtual são redigitados no ERP e o estoque do site não bate com o estoque real.</p>
        <p><strong>O que entregamos:</strong> Pedidos, produtos, preços e estoque sincronizados automaticamente entre loja e ERP, com reprocessamento em caso de falha e alerta quando o erro persiste.</p>
        <p><strong>Resultado:</strong> Cada pedido é digitado 1 vez e percorre todos os sistemas sozinho. Primeiro módulo em produção em 3 a 6 semanas.</p>
      </article>
      <article>
        <h3>Atendimento com IA 24 horas por dia</h3>
        <p><strong>Situação:</strong> Os contatos chegam por WhatsApp, formulário e e-mail, alguém copia tudo para o CRM e, fora do horário comercial, ninguém responde.</p>
        <p><strong>O que entregamos:</strong> Um agente de IA atende no WhatsApp, qualifica o contato, registra tudo no CRM e passa para uma pessoa quando necessário.</p>
        <p><strong>Resultado:</strong> Atendimento 24 horas por dia, 7 dias por semana, e a equipe recebe o lead já triado.</p>
      </article>
      <article>
        <h3>Dashboards em Power BI com indicadores únicos</h3>
        <p><strong>Situação:</strong> Os relatórios são montados à mão no fim do mês, a partir de exportações, e cada área apresenta um número diferente.</p>
        <p><strong>O que entregamos:</strong> Pipelines ETL/ELT que reúnem os dados do ERP, do CRM e das planilhas, e dashboards em Power BI com uma definição única para cada indicador.</p>
        <p><strong>Resultado:</strong> O mesmo número em todas as áreas, atualizado automaticamente, sem exportar planilha.</p>
      </article>

    <section>
      <h2>Perguntas frequentes</h2>
      <h3>A Agência Byte faz marketing ou tráfego pago?</h3>
      <p>Não. Somos uma empresa de engenharia de software. Não fazemos marketing, tráfego pago, gestão de redes sociais nem criação de conteúdo: desenvolvemos sistemas, integrações, automações com IA e dashboards de dados.</p>
      <h3>O que a Agência Byte faz?</h3>
      <p>Desenvolve software sob medida, automações com inteligência artificial, integrações entre sistemas (ERP, CRM, e-commerce e APIs) e dashboards em Power BI com pipelines de dados. Atende principalmente empresas de indústria, logística e distribuição.</p>
      <h3>Quanto custa integrar ERP e e-commerce?</h3>
      <p>O valor depende de quais sistemas entram, de quantos fluxos serão sincronizados (pedidos, produtos, preços, estoque) e do que as APIs de cada sistema permitem. Depois da descoberta (2 a 3 dias), a etapa de estratégia (2 a 4 dias) entrega uma proposta técnica com escopo, cronograma e investimento definidos por escrito, sem surpresa no orçamento.</p>
      <h3>Quanto tempo leva um projeto?</h3>
      <p>Um primeiro módulo em produção costuma levar de 3 a 6 semanas. Projetos maiores são divididos em entregas menores, para você usar o sistema antes do fim do projeto.</p>
      <h3>Vocês integram qualquer sistema?</h3>
      <p>Qualquer sistema que ofereça API, webhook, banco de dados ou exportação de arquivos. Na descoberta avaliamos o que cada sistema permite. Não é preciso trocar de sistema: conectamos o que você já usa.</p>
      <h3>O código fica com a minha empresa?</h3>
      <p>Sim. O código é escrito e mantido pelo nosso time, sem terceirização, e fica no repositório da sua empresa.</p>
      <h3>Vocês dão suporte depois da entrega?</h3>
      <p>Sim. Oferecemos suporte com SLA de até 4 horas úteis e seguimos evoluindo o sistema com você depois do go-live.</p>
