    <h1>Agência Byte | Custom Software Development and AI Automation</h1>
    <p>Software engineering: systems, integration, AI automation and data. We turn bottlenecks into efficiency with fast, custom-built solutions.</p>
    <section>
      <h2>What Agência Byte does and who it is for</h2>
      <p>Agência Byte is a Brazilian technology agency that builds custom software, AI automations, systems integrations and data dashboards. We work with industrial, logistics and distribution companies that run on disconnected ERPs, spreadsheets and sales channels and need repetitive tasks automated, systems in sync and numbers they can trust. We also work with startups and SMBs. All code is written and maintained by our own team, with no outsourcing, and a first module usually reaches production in 3 to 6 weeks.</p>
    </section>

      <h2><a href="/en/services">Services</a></h2>
      <article>
        <h3><a href="/en/services/custom-software-development">Custom Software Development</a></h3>
        <p>Web apps, internal dashboards, APIs and portals. Frontend and backend with Next.js, TypeScript and PostgreSQL.</p>
      </article>
      <article>
        <h3><a href="/en/services/ai-automation">Artificial Intelligence Automation</a></h3>
        <p>AI agents, classification, document extraction and automated 24/7 customer service with LLMs and RAG.</p>
      </article>
      <article>
        <h3><a href="/en/services/systems-integration">Systems Integration</a></h3>
        <p>Connect CRM, ERP, e-commerce and other systems with bidirectional webhooks and incremental sync.</p>

      <article>
        <h3><a href="/en/services/data-and-power-bi">Data and Business Intelligence</a></h3>
        <p>ETL/ELT pipelines, Power BI dashboards and reliable metrics with smart alerts.</p>
      </article>
    </section>
    <section>
      <h2>Project examples</h2>
      <p>Recurring scenarios in Agência Byte projects, and what changes in each one.</p>
      <article>
        <h3><a href="/en/clients/divina-argila">Divina Argila: 4 systems integrated in 40 days</a></h3>
        <p>Divina Argila had fragmented processes and orders to fix in 4 different places. In 40 days, Agência Byte integrated Bling, Trello, TikTok Shop and Mercado Livre, and today the factory team works only in Trello.</p>
        <blockquote><p>“Now our team no longer has to copy and paste the same order into several places. The factory already knows what to produce as soon as the order is issued.”</p></blockquote>
        <p>— Divina Argila, Agência Byte client</p>
      </article>
      <article>
        <h3><a href="/en/clients/cargon">CargOn: data warehouse and 4 predictive dashboards in 30 days</a></h3>
        <p>CargOn wanted a new product for its customers built on the data generated in its platform. In 30 days, Agência Byte delivered the data warehouse, the ETL and 4 logistics dashboards in Power BI, with forecasts.</p>
        <blockquote><p>“Now our customers have structured data on their own operations, insights and predictive data to use in their logistics, and we've created one more monetized product.”</p></blockquote>
        <p>— CargOn, Agência Byte client</p>
      </article>
      <article>
        <h3>ERP and e-commerce in sync</h3>
        <p><strong>Situation:</strong> Online store orders are retyped into the ERP and the website stock does not match the real stock.</p>
        <p><strong>What we deliver:</strong> Orders, products, prices and stock synchronized automatically between store and ERP, with automatic reprocessing on failure and an alert when the error persists.</p>
        <p><strong>Result:</strong> Each order is entered once and flows through every system on its own. First module in production in 3 to 6 weeks.</p>
      </article>
      <article>
        <h3>AI customer service 24 hours a day</h3>
        <p><strong>Situation:</strong> Contacts arrive by WhatsApp, form and email, someone copies everything into the CRM, and outside business hours nobody answers.</p>
        <p><strong>What we deliver:</strong> An AI agent answers on WhatsApp, qualifies the contact, logs everything in the CRM and hands over to a person when needed.</p>
        <p><strong>Result:</strong> Service 24 hours a day, 7 days a week, and the team receives leads already triaged.</p>
      </article>
      <article>
        <h3>Power BI dashboards with a single definition per metric</h3>
        <p><strong>Situation:</strong> Reports are assembled by hand at month end from exports, and each area presents a different number.</p>
        <p><strong>What we deliver:</strong> ETL/ELT pipelines that gather data from the ERP, CRM and spreadsheets, and Power BI dashboards with a single definition for each metric.</p>
        <p><strong>Result:</strong> The same number in every area, updated automatically, with no spreadsheet exports.</p>
      </article>
    </section>

    <section>
      <h2>Frequently asked questions</h2>
      <h3>Does Agência Byte do marketing or paid ads?</h3>
      <p>No. We are a software engineering company. We do not do marketing, paid ads, social media management or content creation: we build systems, integrations, AI automations and data dashboards.</p>
      <h3>What does Agência Byte do?</h3>
      <p>It builds custom software, AI automations, systems integrations (ERP, CRM, e-commerce and APIs) and Power BI dashboards with data pipelines. It mainly serves industrial, logistics and distribution companies.</p>
      <h3>How much does it cost to integrate an ERP and an e-commerce store?</h3>
      <p>The price depends on which systems are involved, how many flows are synchronized (orders, products, prices, stock) and what each system's APIs allow. After discovery (2 to 3 days), the strategy stage (2 to 4 days) delivers a technical proposal with scope, timeline and investment defined in writing, with no budget surprises.</p>
      <h3>How long does a project take?</h3>
      <p>A first module in production usually takes 3 to 6 weeks. Larger projects are split into smaller deliveries, so you use the system before the project ends.</p>
      <h3>Can you integrate any system?</h3>
      <p>Any system that offers an API, webhook, database access or file export. During discovery we assess what each system allows. You do not need to switch systems: we connect what you already use.</p>
      <h3>Does my company keep the code?</h3>
      <p>Yes. The code is written and maintained by our own team, with no outsourcing, and lives in your company's repository.</p>
      <h3>Do you offer support after delivery?</h3>
      <p>Yes. We offer support with an SLA of up to 4 business hours and keep evolving the system with you after go-live.</p>
    </section>
